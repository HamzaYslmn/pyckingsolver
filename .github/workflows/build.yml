name: Build & Publish

on:
  push:
    tags: ["v*"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# MARK: - Build wheels for Win x64, Linux x64, Linux ARM64 (RPi),
#         and macOS ARM64 (Apple Silicon).
#
# Notes:
# - We disable CLP everywhere because the upstream prebuilt is x86_64-only
#   (breaks ARM linking) and HiGHS is the default LP solver anyway.
# - We skip C++ unit tests for speed.
# - Ninja keeps the build fast and uniform across all platforms.
# - Wheels are retagged after build to declare their platform.
jobs:
  build-wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,  tag: win_amd64,                bin: packingsolver_irregular.exe }
          - { os: ubuntu-latest,   tag: manylinux_2_35_x86_64,    bin: packingsolver_irregular     }
          - { os: ubuntu-24.04-arm,tag: manylinux_2_35_aarch64,   bin: packingsolver_irregular     }
          - { os: macos-14,        tag: macosx_11_0_arm64,        bin: packingsolver_irregular     }

    steps:
    - uses: actions/checkout@v4
      with: { submodules: recursive }

    - uses: astral-sh/setup-uv@v5

    # System deps (LAPACK/BZ2 for Linux; Ninja everywhere)
    - name: Install Ninja + system deps (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get -y install ninja-build liblapack-dev libbz2-dev

    - name: Install Ninja (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    - name: Install Ninja (Windows)
      if: runner.os == 'Windows'
      uses: seanmiddleditch/gha-setup-ninja@v5

    # Make MSVC visible to Ninja on Windows
    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    # Cache the C++ build (keyed on solver sources) for fast incremental CI
    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: extern/packingsolver/build
        key: pkgsolver-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('extern/packingsolver/**/CMakeLists.txt', 'extern/packingsolver/**/*.cpp', 'extern/packingsolver/**/*.hpp') }}
        restore-keys: pkgsolver-${{ runner.os }}-${{ runner.arch }}-

    - name: Configure & build C++ solver (Ninja, Release, irregular only)
      working-directory: extern/packingsolver
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPACKINGSOLVER_BUILD_TEST=OFF -DPACKINGSOLVER_USE_CLP=OFF
        cmake --build build --target PackingSolver_irregular_main --parallel

    - name: Bundle solver binary into the Python package
      shell: bash
      run: |
        mkdir -p python/pyckingsolver/bin
        cp "extern/packingsolver/build/src/irregular/${{ matrix.bin }}" python/pyckingsolver/bin/

    - name: Build wheel
      working-directory: python
      run: |
        cp ../README.md README.md
        uv build --wheel -o ../dist

    - name: Tag wheel with platform
      shell: bash
      run: |
        whl=$(ls dist/*.whl)
        uvx wheel tags --remove --platform-tag ${{ matrix.tag }} "$whl"

    - uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}-${{ runner.arch }}
        path: dist/*.whl

  # MARK: - Publish to PyPI on tag push
  publish:
    needs: build-wheel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
    - uses: actions/download-artifact@v4
      with: { path: dist, merge-multiple: true }

    - uses: pypa/gh-action-pypi-publish@release/v1
      with: { packages-dir: dist }
# __PYCK_END__